<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-sheet">
    <header>
      <h1 id="app-title">Fill the blanks</h1>
      <p id="app-instructions">Drag words from the side panel into the rectangular blanks.</p>
      <div class="header-buttons">
        <button id="resetBtn" class="reset-btn" style="display: none;">Reset Exercise</button>
      </div>
    </header>

    <!-- Admin Login Modal -->
    <div id="adminModal" class="modal">
      <div class="modal-content">
        <h2>Admin Login</h2>
        <p>Enter the admin password to unlock word management.</p>
        <input type="password" id="adminPassword" placeholder="Admin password" />
        <div class="modal-buttons">
          <button id="adminLoginBtn" class="btn-primary">Login</button>
          <button id="adminCancelBtn" class="btn-secondary">Cancel</button>
        </div>
        <div id="adminError" class="error-message"></div>
      </div>
    </div>

    <div id="message" class="message" aria-live="polite"></div>

    <!-- Admin Mode Indicator -->
    <div id="adminModeIndicator" class="admin-mode-indicator" style="display: none;">
      <span class="admin-badge">🔓 Admin Mode</span>
      <span class="admin-help">Click words to unlock them for students</span>
      <button id="adminLogoutBtn" class="admin-logout-btn">Logout</button>
    </div>

    <div id="page-navigation" class="page-nav">
      <button id="prevPageBtn" class="nav-btn" disabled>← Previous</button>
      <span id="page-indicator" class="page-indicator">Page 1 of 1</span>
      <button id="nextPageBtn" class="nav-btn">Next →</button>
    </div>

    <div class="app">
      <main id="sentences"></main>

      <aside id="wordbank" class="wordbank">
        <h2>Words</h2>
        <button id="unlockAllBtn" class="unlock-all-btn">Unlock All</button>
        <div id="words" class="words"></div>
      </aside>
    </div>

    <footer class="page-footer">
      <button id="adminBtn" class="admin-btn-subtle">Admin Login</button>
    </footer>

    </div><!-- /.page-sheet -->

    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js"></script>
  </body>
</html>
